# OPTIONAL additional Role for explicitly enabled IRC providers only.
# This file is a reviewable installation artifact; it is never auto-applied.
# Bind it to the operator identity only after operational authorization.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cuse-operator-irc-provider
  namespace: default
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create, patch]
  - apiGroups: [""]
    resources: [pods, endpoints]
    verbs: [get]
