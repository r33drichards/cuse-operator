[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cuse-operator"
version = "0.1.0"
description = "Validation-first Kopf operator for canonical IRC and MCP architecture data"
requires-python = ">=3.12"
dependencies = ["kopf>=1.45.1,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4.23,<5", "ruff>=0.11,<1", "PyYAML>=6,<7"]

[project.scripts]
cuse-validate = "cuse_operator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
